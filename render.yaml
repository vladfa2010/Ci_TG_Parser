  #       value: "1"
  #     # v3 settings
  #     - key: CHANNEL_DELAY_SEC
  #       value: "10"
  #     - key: API_CALL_DELAY_MS
  #       value: "1000"

# ------------------------------------------------------------------------------
# Database
# ------------------------------------------------------------------------------
databases:
  - name: citg-db
    plan: starter
    ipAllowList: []
